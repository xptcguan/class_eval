# Streamlit 项目配置
[theme]
base = "light"
primaryColor = "#3F6BD6"
backgroundColor = "#F6F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2430"
font = "sans serif"

[server]
maxUploadSize = 10
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
toolbarMode = "minimal"

[runner]
# 只重跑变化的片段，切换页面/交互更快
fastReruns = true
